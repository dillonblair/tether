<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tether</title>
<style>
:root { color-scheme: dark; --bg:#0d1014; --card:#171c23; --line:#262d37; --text:#e8ecf1; --dim:#8b96a5; --accent:#4cc2a0; --warn:#e5645b; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:560px; margin:0 auto; padding:28px 18px 60px; }
h1 { font-size:22px; margin:0 0 4px; letter-spacing:.2px; }
h1 span { color:var(--accent); }
p.sub { color:var(--dim); margin:0 0 22px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
label { display:block; font-size:13px; color:var(--dim); margin:10px 0 4px; }
input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0f1318; color:var(--text); font-size:16px; }
button { padding:12px 16px; border-radius:10px; border:0; background:var(--accent); color:#06261d; font-weight:600; font-size:15px; cursor:pointer; }
button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); font-weight:500; }
button.danger { background:transparent; color:var(--warn); border:1px solid var(--line); font-weight:500; padding:8px 12px; font-size:13px; }
.row { display:flex; gap:10px; align-items:center; }
.row > .grow { flex:1; min-width:0; }
.name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.state { font-size:13px; color:var(--dim); }
.dot { width:9px; height:9px; border-radius:50%; background:#4a5361; flex:none; }
.dot.on { background:var(--accent); box-shadow:0 0 8px var(--accent); }
.error { color:var(--warn); font-size:14px; min-height:20px; margin-top:8px; }
.code { font:600 26px/1 ui-monospace,Menlo,monospace; letter-spacing:3px; color:var(--accent); margin:10px 0; }
pre { background:#0f1318; border:1px solid var(--line); border-radius:10px; padding:12px; overflow-x:auto; font-size:13px; margin:8px 0 0; }
.top { display:flex; justify-content:space-between; align-items:flex-start; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>Tether<span>.</span></h1><p class="sub">Your computers, from anywhere.</p></div>
    <button id="signout" class="ghost" hidden>Sign out</button>
  </div>

  <section id="auth" hidden>
    <form class="card" id="authform">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="10" required>
      <div class="error" id="autherr"></div>
      <div class="row">
        <button type="submit" id="signin">Sign in</button>
        <button type="button" class="ghost" id="create">Create account</button>
      </div>
    </form>
  </section>

  <section id="app" hidden>
    <div id="list"></div>
    <div class="card">
      <div class="row">
        <div class="grow"><div class="name">Add a computer</div><div class="state">Get a one-time code for the host agent.</div></div>
        <button id="add">Get code</button>
      </div>
      <div id="pair" hidden>
        <div class="code" id="code"></div>
        <div class="state">Valid for 10 minutes. On the computer to control, run:</div>
        <pre id="cmd"></pre>
      </div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body && JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || 'Something went wrong'), { status: r.status });
  return data;
}
function ago(ts) {
  if (!ts) return 'never connected';
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 90) return 'seen just now';
  if (s < 5400) return `seen ${Math.round(s / 60)} min ago`;
  if (s < 129600) return `seen ${Math.round(s / 3600)} h ago`;
  return `seen ${Math.round(s / 86400)} d ago`;
}
function show(signedIn) {
  $('auth').hidden = signedIn; $('app').hidden = !signedIn; $('signout').hidden = !signedIn;
}
async function refresh() {
  let data;
  try { data = await api('GET', '/api/devices'); }
  catch (e) { if (e.status === 401) show(false); return; }
  show(true);
  const list = $('list');
  list.replaceChildren(...data.devices.map(d => {
    const card = document.createElement('div'); card.className = 'card';
    const row = document.createElement('div'); row.className = 'row';
    const dot = document.createElement('div'); dot.className = 'dot' + (d.online ? ' on' : '');
    const info = document.createElement('div'); info.className = 'grow';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = d.name;
    const state = document.createElement('div'); state.className = 'state'; state.textContent = d.online ? 'Online' : 'Offline, ' + ago(d.last_seen);
    info.append(name, state);
    const open = document.createElement('button'); open.textContent = 'Connect'; open.disabled = !d.online;
    if (!d.online) open.className = 'ghost';
    open.onclick = () => { location.href = `/d/${d.id}/`; };
    const del = document.createElement('button'); del.className = 'danger'; del.textContent = 'Remove';
    del.onclick = async () => { if (confirm(`Remove ${d.name}?`)) { await api('DELETE', `/api/devices/${d.id}`); refresh(); } };
    row.append(dot, info, open, del); card.append(row); return card;
  }));
}
async function sign(path) {
  $('autherr').textContent = '';
  try { await api('POST', path, { email: $('email').value, password: $('password').value }); $('password').value = ''; refresh(); }
  catch (e) { $('autherr').textContent = e.message; }
}
$('authform').onsubmit = e => { e.preventDefault(); sign('/api/login'); };
$('create').onclick = () => { if ($('authform').reportValidity()) sign('/api/register'); };
$('signout').onclick = async () => { await api('POST', '/api/logout'); show(false); };
$('add').onclick = async () => {
  const { code } = await api('POST', '/api/pairing');
  $('code').textContent = code;
  $('cmd').textContent = `tether-agent enroll --relay ${location.origin} --code ${code}\ntether-agent run`;
  $('pair').hidden = false;
};
refresh();
setInterval(() => { if (!$('app').hidden && !document.hidden) refresh(); }, 5000);
</script>
</body>
</html>
